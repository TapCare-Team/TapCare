name: Technical Task
description: Track refactors, tests, migrations, documentation, or developer tooling.
title: "chore: "
labels: ["technical-task"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What technical work needs to be done?
      placeholder: Refactor...
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why is this useful now?
      placeholder: This will make it easier to...
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: Select all areas this task may touch.
      options:
        - label: Domain logic
        - label: Service layer
        - label: Repository layer
        - label: API contracts / validation
        - label: Tests
        - label: Database schema or migrations
        - label: Documentation
        - label: Developer observability

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Any architecture, privacy, or compatibility constraints?
      placeholder: Keep the modular monolith structure...

  - type: textarea
    id: done_when
    attributes:
      label: Done When
      description: What confirms this task is complete?
      placeholder: |
        - Tests pass
        - Documentation updated
        - No behavior changes except...
    validations:
      required: true

  - type: textarea
    id: testing
    attributes:
      label: Testing Notes
      description: What tests should be added, updated, or run?
      placeholder: Add service tests for...
